plain_diffusion:
  n_samples: 100
  S: [10, 50, 100, 200, 400, 600, 800]
  checkpoint: "gs://ddpm-thesis-rh/checkpoints/ddpm/ckpt_epoch_0299.pkl"

sparse_diffusion:
  n_samples: 10
  K: 3
  S: [150, 100, 50]
  checkpoint: "gs://ddpm-thesis-rh/checkpoints/ddpm/ckpt_epoch_0299.pkl"

# Full-sequence inference: reconstruct every (3-frame triplet) frame of one
# sequence by running the K-step / S-step diffusion refinement on each.
sequence_diffusion:
  test_set: False      # reconstruct the last n_test_seqs sequences (the test split)
  seq_idx: -1          # used only when test_set is false (-1 = last / 40th)
  seq_idxs: [0, 1]     # explicit sequence list (overrides test_set / seq_idx); null to disable
  out_tag: "re2000_"   # output filename tag -> sequence_reconstruction_re2000_seq{0,1}.pkl
  batch_size: 16       # frames per step, sharded across chips (must be divisible by n_devices)
  K: 3
  S: [150, 100, 50]
  checkpoint: "gs://ddpm-thesis-rh/checkpoints/ddpm/ckpt_epoch_0299.pkl"
  # degrade_input: build the model input on-the-fly from the clean GT (sparse 1024-pt +
  # NN-fill, = the BaratiLab degradation). Use for generated flows with no pre-made input.
  # Remove/comment it for the test set, where data.data_path is the pre-made npz.
  degrade_input: sparse_nnfill
  #gt_data_path: "gs://ddpm-thesis-rh/flow-data/kf_2d_re1000_256_40seed.npy"
  gt_data_path: "gs://ddpm-thesis-rh/flow-data/generated/jaxcfd_re2000_1024to256_40seq.npy"
  mean: 0.0            # model normalization = kf_2d first-32 train split (new 32/4/4 split)
  std: 4.7988          # corrected from 5.0157; checkpoint (06-11) was trained with the new split
  store_iterations: false   # if true, keep every K-iteration output (large pickle)


nn_fill:
  sparsity_ratio: 16
  seeds: [42, 43, 44]

inference_seed: 42

super_resolution:
  task: 2  # 1=deterministic LR→HR bicubic, 2=random sparse NN-fill
  lr_res: 64          # LR grid size (32x32 -> 256x256 is 64x sparsity)
  upsample_method: bicubic
