model:
  ch: 64
  ch_mult: [1, 1, 1, 2]
  out_ch: 3
  in_ch: 3
  n_resnet_blocks: 1
  dropout_p: 0.0
  freq_dim: 128

diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  batch_size: 32
  learning_rate: 0.0002
  n_epochs: 300
  seed: 0

data:
  image_size: 256
  gcs_bucket: thesis-project-bucket-rh-ucl
  data_path: flow-data/kf_2d_re1000_256_40seed (1).npy
  n_train_seqs: 32
  n_val_seqs: 4
  n_test_seqs: 4

checkpointing:
  save_every_n_epochs: 10
  checkpoint_dir: checkpoints/ddpm
